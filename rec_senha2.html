<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl | Recuperar Senha</title>
</head>
<body>
    <h1>Registre sua nova Senha</h1>
    <img src="assets/images/icone_usuario.jpg" alt="ícone de usuário">
    <form action="index.html" method="get">
        <div class="registrar_senha">
            <label for="nova_senha">Nova Senha</label> <br>
            <input type="text" name="nova_senha" id="nova_senha" placeholder="Digite a senha" minlength="8" maxlength="20" required>
            <label for="confirme_senha">Confirme a Senha</label> <br>
            <input type="text" name="confirme_senha" id="confirme_senha" placeholder="Digite a senha" minlength="8" maxlength="20" required>
        </div>

        <div class="botoes">
            <a id="voltar_login" href="index.html">Voltar para o Login</a>
            <button type="submit" id="botao_registrar">Registrar a Senha</button>
        </div>
    </form>
</body>
</html>
