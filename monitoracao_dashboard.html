<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo_site.png">
    <link rel="stylesheet" href="assets/css/monitoracao_dashboard.css">
    <title>SmartControl | Dashboard Monitoração de Eficiência Geral</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="dashboard.html"><img src="assets/images/logo-voltar-sem-fundo.png" alt="logo de Voltar" id="logo"><h3>Voltar</h3></a></li>
                <li><h1 id="titulo">Monitoração de Eficiência Geral</h1></li>
                <li><a href="index.html"><img src="assets/images/logo-saida-sem-fundo.png" alt="logo de saída" id="icone_saida"></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="caixas">
            <div class="caixa1">
                <h1 id="titulo1">Performance e Disponibilidade</h1>
                <ul class="legenda_grafico">
                    <li><span class="dot-1"></span> <h1>Manufatura</h1></li>
                    <li><span class="dot-2"></span> <h1>Máquinas</h1></li>
                </ul>
                <div class="barras">
                    <div class="estatistica1">
                        <div class="colunas1">
                            <div class="coluna1">67</div>
                            <div class="coluna2">33</div>
                        </div>
                        <h3>Janeiro</h3>
                    </div>
                    <div class="estatistica2">
                        <div class="colunas2">
                            <div class="coluna3">72</div>
                            <div class="coluna4">28</div>
                        </div>
                        <h3>Fevereiro</h3>
                    </div>
                    <div class="estatistica3">
                        <div class="colunas3">
                            <div class="coluna5">52</div>
                            <div class="coluna6">48</div>
                        </div>
                        <h3>Março</h3>
                    </div>
                </div>
            </div>
            <div class="caixa2">
                <h3 id="titulo2">Ciclo de Produção (Tempo)</h3>
                <div class="grafico">
                  <div class="pizza"></div>
                  <ul class="legenda_grafico2">
                    <li><span class="dot-3"></span> <h1>Manufatura (40%)</h1></li>
                    <li><span class="dot-4"></span> <h1>Máquinas (60%)</h1></li>
                  </ul>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
