<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl | Cadastro</title>
</head>
<body>
    <img src="assets/images/icone_usuario.jpg" alt="ícone de usuário">
    <form action="index.html" method="get">
        <div class="cadastro">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome" required>
            <label for="email">E-mail:</label> <br>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
            <label for="senha">Crie uma Senha:</label><br>
            <input type ="password" name="senha" id="senha" placeholder="Digite sua senha" minlength="8" required>
        </div>

        <div class="botoes">
            <a id="voltar_login" href="index.html">Voltar para o Login</a>
            <button type="submit" id="cadastrar">Cadastrar</button>
            <input type="checkbox" id="termos" required><label for="termos">Aceite os termos de uso</label>
        </div>


    </form>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1600.6659876351232!2d-43.35138192433885!3d-21.752435486971248!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989c976673a705%3A0xb0aa4dd64090a7f5!2sSENAI%20Juiz%20de%20Fora%20CFP%20Jos%C3%A9%20Fagundes%20Netto!5e1!3m2!1spt-BR!2sbr!4v1785871436700!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
