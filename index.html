<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo_site.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>SmartControl</title>
</head>
<body>
    <div class="logo-empresa">
        <img src="assets/images/logo-sem-fundo.png" alt="Logo do SmartControl">
        <div class="subtitulo">
            <h2 class="boasvindas">Seja Bem-Vindo ao Frebunda Company!<br></h2>
            <h2><a id="subtitulo_login" href="#login">Faça o login na sua conta!</a></h2>
        </div>
        <div class="rodape">
            <ul>
                <li><a id="saibamais" href="https://www.automateshow.com/blog/how-automation-is-impacting-the-automotive-industry-today" target="_blank">Saiba Mais</a></li>     
                <p> &copy; 2026 Meu Site. Todos Direitos Reservados</p>
                <div class="link">
                    <li><a href="https://pedrotech.com.br/pedrolandia/">Sobre</a></li>
                    <li><a href="#">Contato</a></li>
                </div>
            </ul>
        </div>
    </div>
    <summary>login</summary>
    <div class="parte_formulario">
        <img src="assets/images/icone_usuario.jpg" alt="Imagem de Perfil" id="icone_usuario">
        <form class="formulario" action="dashboard.html" method="get">
            <div class="login">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
                <label for="senha">Senha:</label>
                <input type ="password" name="senha" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="botoes">
                <a id="cadastro" href="cadastro.html">Cadastrar-se</a>
                <button type="submit" id="login">Login</button>
                <a id="recuperar" href="rec_senha.html">Recuperar senha</a>
            </div> 
        </form>
    </div>
<script src="assets/js/main.js"></script>
</body>
</html>
